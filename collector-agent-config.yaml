# OTel Arcade — Lab 3: Agent → Gateway.
#
# The agent no longer exports directly to Honeycomb. Instead it forwards
# all telemetry to the gateway, which handles final export and fan-out.
#
# Steps:
#   1. Deploy the gateway first (Gateway tab → Deploy Gateway)
#   2. Apply this config (Agent tab → Apply & Restart, or save in IDE Watch Mode)
#   3. Watch the Visualizer topology update to show the two-hop pipeline
#
# Edit here or open collector-agent-config.yaml at the repo root in your IDE.

# ── Receivers ────────────────────────────────────────────────────────
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# ── Processors ───────────────────────────────────────────────────────
# Same transforms from Lab 2 — the agent still cleans up telemetry
# before forwarding. The gateway receives already-normalized data.
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    send_batch_size: 512
    timeout: 5s
  filter/drop_probes:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, "^(GET|POST) /(health|ready)$")'
  transform/normalize:
    trace_statements:
      - context: span
        statements:
          - replace_pattern(span.name, "^(SELECT|INSERT|UPDATE|DELETE|CREATE).*", "db.query")
          - set(span.attributes["player.id"], "***") where span.attributes["player.id"] != nil
          - truncate_all(span.attributes, 128)
      - context: resource
        statements:
          - delete_key(resource.attributes, "app.name")

# ── Exporters ────────────────────────────────────────────────────────
# otlp_grpc/gateway: forwards to the gateway instead of Honeycomb directly.
#   The gateway's DNS name on the Docker network is otel-collector-gateway.
# otlp_http/visualizer-raw: still needed for the Split (Before→After) view.
exporters:
  debug:
    verbosity: basic
  otlp_grpc/gateway:
    endpoint: otel-collector-gateway:4317
    tls:
      insecure: true
  otlp_http/visualizer-raw:
    endpoint: http://visualizer:4318
    encoding: json
    headers:
      x-raw-channel: "true"
      x-collector-source: agent
    tls:
      insecure: true

# ── Service ──────────────────────────────────────────────────────────
service:
  telemetry:
    # ── Lab 4 Exercise 1: Tag the Collector in Honeycomb ──────────────────
    # Without service.name, self-metrics arrive unidentified — indistinguishable
    # from app metrics. Uncomment to tag every metric and log from this Collector.
    # resource:
    #   attributes:
    #     - name: service.name
    #       value: otel-collector-agent

    # ── Lab 4 Exercise 3: Push Collector logs to Honeycomb ───────────────
    # logs:
    #   level: info
    #   processors:
    #     - batch:
    #         exporter:
    #           otlp:
    #             protocol: http/protobuf
    #             endpoint: https://api.honeycomb.io/v1/logs
    #             headers:
    #               - name: x-honeycomb-team
    #                 value: ${env:HONEYCOMB_API_KEY}
    #               - name: x-honeycomb-dataset
    #                 value: otel-collector
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
        # ── Lab 4 Exercise 2: Push Collector metrics to Honeycomb ─────────
        # The Visualizer scrapes from the pull reader above — real-time only.
        # Add a periodic reader to push otelcol_* metrics to Honeycomb so you
        # can query pipeline health historically and build alerts.
        # - periodic:
        #     exporter:
        #       otlp:
        #         protocol: http/protobuf
        #         endpoint: https://api.honeycomb.io/v1/metrics
        #         headers:
        #           - name: x-honeycomb-team
        #             value: ${env:HONEYCOMB_API_KEY}
        #           - name: x-honeycomb-dataset
        #             value: otel-collector
  pipelines:
    # traces/raw: captures spans BEFORE transforms — powers the Split view.
    traces/raw:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp_http/visualizer-raw]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop_probes, batch, transform/normalize]
      exporters: [debug, otlp_grpc/gateway]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_grpc/gateway]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_grpc/gateway]
