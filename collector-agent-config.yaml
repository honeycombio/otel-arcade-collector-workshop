# OTel Arcade — Lab 1: Your first Collector pipeline.
#
# The components below are defined but not yet connected. Your job is to
# wire them into named pipelines in the service.pipelines section at the bottom.
#
# Edit here or open collector-agent-config.yaml at the repo root in your IDE
# (use IDE Watch Mode on this tab to auto-restart on every save).

# ── Receivers ────────────────────────────────────────────────────────
# Receivers are the entry point — they define how telemetry gets IN.
# The arcade services emit OTLP over gRPC (4317) and HTTP (4318).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# ── Processors ───────────────────────────────────────────────────────
# Processors transform or filter data in flight, in the order listed.
# memory_limiter: hard cap on RAM usage — prevents OOM crashes under load.
# Batching happens in the otlp_grpc/backend exporter sending_queue, not in a processor.
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

# ── Exporters ────────────────────────────────────────────────────────
# Exporters define where telemetry goes OUT.
# otlp_grpc/backend  → Honeycomb (credentials come from the .env file at the repo root).
# otlp_http/visualizer → local Pipeline Visualizer (shows the live feed and topology).
# debug               → Collector stdout (useful when reading logs).
exporters:
  debug:
    verbosity: basic
  otlp_grpc/backend:
    endpoint: ${env:OTEL_EXPORTER_ENDPOINT}
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
    sending_queue:
      enabled: true
      sizer: items
      batch:
        flush_timeout: 5s
        min_size: 512
  otlp_http/visualizer:
    endpoint: http://visualizer:4318
    encoding: json
    headers:
      x-collector-source: agent
    tls:
      insecure: true

# ── Service ──────────────────────────────────────────────────────────
# The service block wires everything together into named pipelines.
# Each pipeline routes one signal type: receivers → processors → exporters.
service:
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    # These pipelines receive OTLP telemetry and currently only log to debug output.
    # Your job: add the exporters that send data to the Visualizer and Honeycomb.
    # Available exporters: debug · otlp_grpc/backend · otlp_http/visualizer
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [debug]
