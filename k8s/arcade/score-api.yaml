apiVersion: apps/v1
kind: Deployment
metadata:
  name: score-api
  namespace: arcade
  labels: { app: score-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: score-api }
  template:
    metadata:
      labels: { app: score-api }
    spec:
      containers:
        - name: score-api
          image: o11ycon-arcade/score-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: score-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: otel-collector-agent.otel-system.svc.cluster.local:4317
            - name: LEADERBOARD_URL
              value: http://leaderboard.arcade.svc.cluster.local:5000
            - name: SCORE_API_DB
              value: /tmp/scores.db
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: score-api
  namespace: arcade
spec:
  selector: { app: score-api }
  ports:
    - port: 8080
      targetPort: 8080
      name: http
