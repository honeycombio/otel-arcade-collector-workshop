apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaderboard
  namespace: arcade
  labels: { app: leaderboard }
spec:
  replicas: 1
  selector:
    matchLabels: { app: leaderboard }
  template:
    metadata:
      labels: { app: leaderboard }
    spec:
      containers:
        - name: leaderboard
          image: o11ycon-arcade/leaderboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: OTEL_SERVICE_NAME
              value: leaderboard
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: otel-collector-agent.otel-system.svc.cluster.local:4317
            - name: LEADERBOARD_DB
              value: /tmp/leaderboard.db
          readinessProbe:
            httpGet: { path: /ready, port: 5000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: leaderboard
  namespace: arcade
spec:
  selector: { app: leaderboard }
  ports:
    - port: 5000
      targetPort: 5000
      name: http
