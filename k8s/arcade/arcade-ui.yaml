apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcade-ui
  namespace: arcade
  labels: { app: arcade-ui }
spec:
  replicas: 1
  selector:
    matchLabels: { app: arcade-ui }
  template:
    metadata:
      labels: { app: arcade-ui }
    spec:
      serviceAccountName: arcade-ui
      containers:
        - name: arcade-ui
          image: o11ycon-arcade/arcade-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: OTEL_SERVICE_NAME
              value: arcade-ui
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-agent.otel-system.svc.cluster.local:4317
            - name: SCORE_API_URL
              value: http://score-api.arcade.svc.cluster.local:8080
            - name: LEADERBOARD_URL
              value: http://leaderboard.arcade.svc.cluster.local:5000
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: arcade-ui
  namespace: arcade
spec:
  selector: { app: arcade-ui }
  ports:
    - port: 3000
      targetPort: 3000
      name: http
