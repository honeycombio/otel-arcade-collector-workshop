apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector-agent
  namespace: otel-system
  labels: { app: otel-collector-agent }
spec:
  selector:
    matchLabels: { app: otel-collector-agent }
  template:
    metadata:
      labels: { app: otel-collector-agent }
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.151.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: metrics,   containerPort: 8888 }
          env:
            - name: OTEL_EXPORTER_ENDPOINT
              value: api.honeycomb.io:443
            - name: HONEYCOMB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: honeycomb
                  key: api-key
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: config
          configMap:
            name: otel-collector-agent-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-agent
  namespace: otel-system
spec:
  selector: { app: otel-collector-agent }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: metrics,   port: 8888, targetPort: 8888 }
