# Gateway Collector — Lab 4 only.
#
# IMPORTANT: this manifest is NOT applied by `kubectl apply -f k8s/` by default
# at workshop start (the agent DaemonSet exports directly to backend + visualizer).
# In Lab 4, attendees explicitly run:
#   kubectl apply -f k8s/otel-system/collector-gateway.yaml
# and then change the agent ConfigMap to forward to this gateway instead of
# the backend directly. This file exists so attendees don't have to invent
# the gateway shape mid-lab — they just promote it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-gateway-config
  namespace: otel-system
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 1024
        spike_limit_mib: 256

    exporters:
      debug:
        verbosity: basic
      otlp_grpc/backend:
        endpoint: ${env:OTEL_EXPORTER_ENDPOINT}
        headers:
          x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
        sending_queue:
          enabled: true
          sizer: items
          batch:
            flush_timeout: 5s
            min_size: 512
      otlp_http/visualizer:
        endpoint: http://visualizer.workshop-tools.svc.cluster.local:4318
        encoding: json
        tls:
          insecure: true

    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: "0.0.0.0"
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [debug, otlp_grpc/backend, otlp_http/visualizer]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [debug, otlp_grpc/backend, otlp_http/visualizer]
        logs:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [debug, otlp_grpc/backend, otlp_http/visualizer]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-gateway
  namespace: otel-system
  labels: { app: otel-collector-gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: otel-collector-gateway }
  template:
    metadata:
      labels: { app: otel-collector-gateway }
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.159.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: metrics,   containerPort: 8888 }
          env:
            - name: OTEL_EXPORTER_ENDPOINT
              value: api.honeycomb.io:443
            - name: HONEYCOMB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: honeycomb
                  key: api-key
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
      volumes:
        - name: config
          configMap:
            name: otel-collector-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-gateway
  namespace: otel-system
spec:
  selector: { app: otel-collector-gateway }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: metrics,   port: 8888, targetPort: 8888 }
