app = "otel-arcade-leaderboard"
primary_region = "iad"

[build]

[env]
  PORT = "5000"
  LEADERBOARD_DB = "/tmp/leaderboard.db"
  # No collector on Fly — point to localhost so gRPC fails fast instead of DNS-timing-out.
  OTEL_EXPORTER_OTLP_ENDPOINT = "localhost:4317"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
