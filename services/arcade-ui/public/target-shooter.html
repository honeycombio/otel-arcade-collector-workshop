<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Target Shooter — OTel Arcade</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell game-shell">
    <h1 class="brand">Target Shooter</h1>
    <div class="scorebar">
      <span>hits: <b id="hits">0</b></span>
      <span>misses: <b id="misses">0</b></span>
      <span>time: <b id="time">30</b>s</span>
      <span>player: <b id="player"></b></span>
    </div>
    <div class="target-field" id="field"></div>
  </div>
  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/browser-tracer.js"></script>
  <script src="/js/target-shooter.js"></script>
</body>
</html>
