<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile — OTel Arcade</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell profile-shell">
    <h1 class="brand">Profile</h1>

    <div class="profile-section">
      <span class="profile-label">Your avatar</span>
      <div class="avatar-grid" id="avatar-grid"></div>
    </div>

    <div class="profile-section">
      <label class="profile-label" for="display-name">Display name</label>
      <div style="display:flex;align-items:center;gap:10px">
        <input
          class="profile-input"
          id="display-name"
          type="text"
          placeholder="How you appear on the leaderboard"
          maxlength="24"
          autocomplete="off"
        />
        <span id="name-saved" style="font-size:11px;color:var(--accent2);opacity:0;transition:opacity 300ms">saved</span>
      </div>
      <p class="profile-hint">Appears on the leaderboard and in the sidebar.</p>
    </div>

    <div class="profile-section">
      <label class="profile-label" for="api-key">Honeycomb API key</label>
      <div style="display:flex;align-items:center;gap:10px">
        <input
          class="profile-input"
          id="api-key"
          type="password"
          placeholder="Your Honeycomb ingest key"
          autocomplete="off"
        />
        <button id="api-key-toggle" class="btn" type="button" style="padding:4px 12px;font-size:11px" onclick="toggleKeyVisibility()">Show</button>
        <span id="key-saved" style="font-size:11px;color:var(--accent2);opacity:0;transition:opacity 300ms">saved</span>
      </div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:12px">
        <button id="api-key-apply" class="btn" type="button" style="padding:7px 18px;font-size:12px" onclick="applyApiKey()">Apply to Collector</button>
        <span id="key-status" style="font-size:12px"></span>
      </div>
      <p class="profile-hint" style="margin-top:8px">Applies to the running collector and pre-fills config templates. The gateway uses this key when deployed.</p>
    </div>
  </div>

  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script>
  var AVATARS = [
    { key: 'robot',   emoji: '🤖', label: 'Robot'      },
    { key: 'alien',   emoji: '👾', label: 'Alien'      },
    { key: 'fox',     emoji: '🦊', label: 'Fox'        },
    { key: 'dragon',  emoji: '🐉', label: 'Dragon'     },
    { key: 'unicorn', emoji: '🦄', label: 'Unicorn'    },
    { key: 'ghost',   emoji: '👻', label: 'Ghost'      },
    { key: 'ninja',   emoji: '🥷', label: 'Ninja'      },
    { key: 'wizard',  emoji: '🧙', label: 'Wizard'     },
    { key: 'rocket',  emoji: '🚀', label: 'Rocket'     },
    { key: 'cat',     emoji: '🐱', label: 'Cat'        },
    { key: 'octopus', emoji: '🐙', label: 'Octopus'    },
    { key: 'gamepad', emoji: '🎮', label: 'Controller' },
  ];

  var selectedKey = localStorage.getItem('arcade.player_avatar') || '';

  function renderGrid() {
    var grid = document.getElementById('avatar-grid');
    grid.innerHTML = AVATARS.map(function (a) {
      var cls = 'avatar-card' + (a.key === selectedKey ? ' selected' : '');
      return '<div class="' + cls + '" onclick="selectAvatar(\'' + a.key + '\')" title="' + a.label + '">'
        + '<span class="avatar-emoji">' + a.emoji + '</span>'
        + '<span class="avatar-label">' + a.label + '</span>'
        + '</div>';
    }).join('');
  }

  function selectAvatar(key) {
    selectedKey = key;
    localStorage.setItem('arcade.player_avatar', selectedKey);
    renderGrid();
  }

  function flashSaved(id) {
    var el = document.getElementById(id);
    el.style.opacity = '1';
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.style.opacity = '0'; }, 1200);
  }

  function toggleKeyVisibility() {
    var input = document.getElementById('api-key');
    var btn   = document.getElementById('api-key-toggle');
    if (input.type === 'password') {
      input.type  = 'text';
      btn.textContent = 'Hide';
    } else {
      input.type  = 'password';
      btn.textContent = 'Show';
    }
  }

  // Restore saved state on load and wire up auto-save
  document.addEventListener('DOMContentLoaded', function () {
    var input = document.getElementById('display-name');
    input.value = localStorage.getItem('arcade.player_name') || '';
    renderGrid();

    var nameTimer = null;
    input.addEventListener('input', function () {
      clearTimeout(nameTimer);
      nameTimer = setTimeout(function () {
        var name = input.value.trim();
        if (name) localStorage.setItem('arcade.player_name', name);
        flashSaved('name-saved');
      }, 400);
    });

    var keyInput  = document.getElementById('api-key');
    keyInput.value = localStorage.getItem('arcade.honeycomb_api_key') || '';

    var keyTimer = null;
    keyInput.addEventListener('input', function () {
      clearTimeout(keyTimer);
      document.getElementById('key-status').textContent = '';
      keyTimer = setTimeout(function () {
        var val = keyInput.value.trim();
        if (val) {
          localStorage.setItem('arcade.honeycomb_api_key', val);
        } else {
          localStorage.removeItem('arcade.honeycomb_api_key');
        }
        flashSaved('key-saved');
      }, 400);
    });
  });

  async function applyApiKey() {
    var val = document.getElementById('api-key').value.trim();
    if (!val) return;
    var btn    = document.getElementById('api-key-apply');
    var status = document.getElementById('key-status');
    btn.disabled    = true;
    status.style.color = 'var(--muted)';
    status.textContent = 'Applying…';
    try {
      var r    = await fetch('/api/settings/honeycomb-key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ apiKey: val }),
      });
      var data = await r.json();
      if (!r.ok) {
        status.style.color = 'var(--error, #ff5d5d)';
        status.textContent = data.error || 'Error applying key';
      } else {
        status.style.color = 'var(--accent2)';
        var label = data.team ? data.team + (data.environment ? ' / ' + data.environment : '') : 'Connected';
        status.textContent = '✓ ' + label + (data.restarted ? '' : ' (collector already up to date)');
      }
    } catch (err) {
      status.style.color = 'var(--error, #ff5d5d)';
      status.textContent = 'Request failed — is the server running?';
    }
    btn.disabled = false;
  }
  </script>
</body>
</html>
