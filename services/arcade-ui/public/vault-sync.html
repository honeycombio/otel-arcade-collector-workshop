<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vault Sync — OTel Arcade</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell game-shell">
    <h1 class="brand">Vault Sync</h1>
    <div class="scorebar">
      <span>round: <b id="round-num">1</b></span>
      <span>committed: <b id="committed">0</b></span>
      <span>score: <b id="score">0</b></span>
      <span>player: <b id="player"></b></span>
    </div>
    <p class="game-hint">Three vaults must all agree to commit. Click PREPARE HEIST — if all vaults are ready the transaction commits. A mole vault will refuse prepare and trigger parallel rollbacks.</p>
    <div id="vault-area"></div>
  </div>
  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/vault-sync.js"></script>
</body>
</html>
