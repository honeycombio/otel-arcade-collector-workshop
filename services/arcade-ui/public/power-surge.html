<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Power Surge — OTel Arcade</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell game-shell">
    <h1 class="brand">Power Surge</h1>
    <div class="scorebar">
      <span>time: <b id="timer">60</b>s</span>
      <span>hits: <b id="hits">0</b></span>
      <span>score: <b id="score">0</b></span>
      <span>player: <b id="player"></b></span>
    </div>
    <p class="game-hint">Four circuit nodes cycle CLOSED → OPEN → HALF-OPEN. Click CLOSED nodes (+20). OPEN nodes reject instantly. HALF-OPEN probes (+15 on success, reopens on failure).</p>
    <div id="nodes" class="surge-nodes"></div>
    <div id="status" class="surge-status"></div>
  </div>
  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/power-surge.js"></script>
</body>
</html>
