<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse — OTel Arcade</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell game-shell">
    <h1 class="brand">Pulse</h1>
    <div class="scorebar">
      <span>events: <b id="event-num">0</b>/8</span>
      <span>score: <b id="score">0</b></span>
      <span>player: <b id="player"></b></span>
    </div>
    <p class="game-hint">Click an event node to publish it. Each event fans out to four subscribers — metrics, audit, notify, cache. Each subscriber has its own latency and failure rate.</p>
    <div id="sub-status" class="pulse-sub-status"></div>
    <div id="events-area" class="pulse-events"></div>
  </div>
  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/pulse.js"></script>
</body>
</html>
