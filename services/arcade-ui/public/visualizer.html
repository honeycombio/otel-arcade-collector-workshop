<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pipeline Visualizer — OTel Arcade</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <iframe id="viz-frame" class="viz-frame" title="Pipeline Visualizer"></iframe>
  <script src="/js/nav.js"></script>
  <script>
    const host = location.hostname;
    const vizUrl = host.includes('.env.play.instruqt.com')
      ? location.protocol + '//' + host.replace('-3000-', '-8090-') + '/'
      : location.protocol + '//' + host + ':8090/';
    document.getElementById('viz-frame').src = vizUrl;
  </script>
</body>
</html>
