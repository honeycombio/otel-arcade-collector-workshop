<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laser Grid — OTel Arcade</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell game-shell">
    <h1 class="brand">Laser Grid</h1>
    <div class="scorebar">
      <span>time: <b id="timer">60</b>s</span>
      <span>hits: <b id="hits">0</b></span>
      <span>score: <b id="score">0</b></span>
      <span>player: <b id="player"></b></span>
    </div>
    <p class="game-hint">Shoot asteroids before they land. Fire too fast and your token bucket depletes — shots throttle (brief wait, +5) then reject (ERROR span, no points). Watch the meter.</p>
    <div class="laser-meter-bar"><div id="token-fill" class="laser-meter-fill" style="width:100%"></div></div>
    <div id="token-label" class="laser-meter-label">tokens: 10.0</div>
    <div id="field" class="laser-field"></div>
    <div id="laser-status" class="laser-status-flash"></div>
  </div>
  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/laser-grid.js"></script>
</body>
</html>
