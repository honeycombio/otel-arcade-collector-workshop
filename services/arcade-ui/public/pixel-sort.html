<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel Sort — OTel Arcade</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell game-shell">
    <h1 class="brand">Pixel Sort</h1>
    <div class="scorebar">
      <span>round: <b id="round">1</b>/5</span>
      <span>score: <b id="score">0</b></span>
      <span>player: <b id="player"></b></span>
    </div>
    <p class="game-hint">Four data sectors light up one by one. Click each sector the moment it activates. When all four are clicked, the sort runs — scatter partitions in parallel, then a gather merge.</p>
    <div id="buckets" class="sort-buckets"></div>
    <div id="status" class="sort-status"></div>
  </div>
  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/pixel-sort.js"></script>
</body>
</html>
