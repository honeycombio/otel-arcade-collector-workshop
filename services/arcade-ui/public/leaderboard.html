<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leaderboard — OTel Arcade</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell">
    <h1 class="brand">Leaderboard</h1>
    <p class="tagline">Top scores across all games.</p>

    <section class="lb-section">
      <div class="lb-header">
        <h2 class="lb-title">Top Scores</h2>
        <select class="lb-select" id="lb-game">
          <option value="">All Games</option>
          <option value="memory">Memory Match</option>
          <option value="typing">Typing Speed</option>
          <option value="whackamole">Whack-a-Mole</option>
          <option value="reaction">Reaction Timer</option>
          <option value="target-shooter">Target Shooter</option>
          <option value="word-scramble">Word Scramble</option>
          <option value="math-sprint">Math Sprint</option>
          <option value="simon-says">Simon Says</option>
          <option value="speed-tap">Speed Tap</option>
          <option value="wave-defender">Wave Defender</option>
          <option value="bid-wars">Bid Wars</option>
          <option value="hot-cache">Hot Cache</option>
          <option value="pixel-sort">Pixel Sort</option>
          <option value="chain-reaction">Chain Reaction</option>
          <option value="deadline-dash">Deadline Dash</option>
        </select>
        <span class="lb-age" id="lb-age"></span>
      </div>
      <table class="lb-table">
        <thead>
          <tr><th>#</th><th>Player</th><th>Game</th><th>Score</th><th>Difficulty</th></tr>
        </thead>
        <tbody id="lb-body">
          <tr><td colspan="5" class="lb-empty">Loading…</td></tr>
        </tbody>
      </table>
    </section>
  </div>

  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script>window.LB_LIMIT = 10;</script>
  <script src="/js/leaderboard.js"></script>
</body>
</html>
