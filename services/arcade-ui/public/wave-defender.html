<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wave Defender — OTel Arcade</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell game-shell">
    <h1 class="brand">Wave Defender</h1>
    <div class="scorebar">
      <span>wave: <b id="wave-num">1</b>/3</span>
      <span>destroyed: <b id="destroyed">0</b></span>
      <span>escaped: <b id="escaped">0</b></span>
      <span>score: <b id="score">0</b></span>
      <span>player: <b id="player"></b></span>
    </div>
    <p class="game-hint">Click enemies to destroy them before they reach your base 🏰. Three waves, each harder than the last.</p>
    <div class="wave-phase-banner" id="banner">Get ready…</div>
    <div id="tracks"></div>
    <div class="wave-result-row" id="result-row"></div>
  </div>
  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/wave-defender.js"></script>
</body>
</html>
