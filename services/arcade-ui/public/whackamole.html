<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Whack-a-Mole — OTel Arcade</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell game-shell">
    <h1 class="brand">Whack-a-Mole</h1>
    <div class="scorebar">
      <span>hits: <b id="hits">0</b></span>
      <span>misses: <b id="misses">0</b></span>
      <span>time: <b id="time">30</b>s</span>
      <span>player: <b id="player"></b></span>
    </div>
    <p class="game-hint">Click moles the moment they pop up. You have 30 seconds — don't miss!</p>
    <div class="whack-grid" id="grid"></div>
  </div>
  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/whackamole.js"></script>
</body>
</html>
