<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Word Scramble — OTel Arcade</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell game-shell">
    <h1 class="brand">Word Scramble</h1>
    <div class="scorebar">
      <span>word: <b id="word-num">1</b> / 8</span>
      <span>score: <b id="score">0</b></span>
      <span>player: <b id="player"></b></span>
    </div>
    <p class="game-hint">Unscramble each word and type it in. Three guesses per word before it's skipped.</p>
    <div class="scramble-word" id="scrambled"></div>
    <div class="scramble-form">
      <input class="scramble-input" id="guess" placeholder="YOUR ANSWER" maxlength="12" autocomplete="off" />
      <button class="btn" onclick="submitGuess()">Submit</button>
    </div>
    <div class="scramble-feedback" id="feedback"></div>
    <div class="attempt-dots" id="dots"></div>
  </div>
  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/word-scramble.js"></script>
</body>
</html>
