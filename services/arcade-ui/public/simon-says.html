<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simon Says — OTel Arcade</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell game-shell">
    <h1 class="brand">Simon Says</h1>
    <div class="scorebar">
      <span>round: <b id="round">0</b></span>
      <span>sequence: <b id="seq-len">—</b></span>
      <span>player: <b id="player"></b></span>
    </div>
    <div class="simon-grid" id="grid">
      <button class="simon-btn" data-color="red"    onclick="playerPress('red')"></button>
      <button class="simon-btn" data-color="green"  onclick="playerPress('green')"></button>
      <button class="simon-btn" data-color="blue"   onclick="playerPress('blue')"></button>
      <button class="simon-btn" data-color="yellow" onclick="playerPress('yellow')"></button>
    </div>
    <div class="simon-status" id="status">Loading…</div>
  </div>
  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/simon-says.js"></script>
</body>
</html>
