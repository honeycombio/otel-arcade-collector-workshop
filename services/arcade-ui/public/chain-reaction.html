<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chain Reaction — OTel Arcade</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell game-shell">
    <h1 class="brand">Chain Reaction</h1>
    <div class="scorebar">
      <span>chains: <b id="chains">0</b></span>
      <span>time: <b id="timer">45</b>s</span>
      <span>score: <b id="score">0</b></span>
      <span>player: <b id="player"></b></span>
    </div>
    <p class="game-hint">Click the tiles in order (Step 1 → Step 6). The tiles are shuffled — find each next step. One wrong click breaks the chain: saga fails, compensation spans roll back every completed step.</p>
    <div id="tiles" class="chain-tiles"></div>
    <div id="status" class="chain-status"></div>
  </div>
  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/chain-reaction.js"></script>
</body>
</html>
