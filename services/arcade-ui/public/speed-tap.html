<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Speed Tap — OTel Arcade</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell game-shell">
    <h1 class="brand">Speed Tap</h1>
    <div class="scorebar">
      <span>taps: <b id="taps">0</b></span>
      <span>time: <b id="time">10</b>s</span>
      <span>player: <b id="player"></b></span>
    </div>
    <button class="tap-btn" id="tap-btn" onclick="onTap()">TAP</button>
    <div class="tap-rate" id="rate"></div>
  </div>
  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/speed-tap.js"></script>
</body>
</html>
