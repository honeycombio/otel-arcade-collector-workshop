<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typing Speed — OTel Arcade</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell game-shell">
    <h1 class="brand">Typing Speed</h1>
    <div class="scorebar">
      <span>WPM: <b id="wpm">0</b></span>
      <span>errors: <b id="errors">0</b></span>
      <span>player: <b id="player"></b></span>
    </div>
    <p class="game-hint">Retype the passage exactly as shown. Start typing to begin — accuracy and speed both count.</p>
    <div class="typing-area" id="passage"></div>
    <input class="typing-input" id="input" placeholder="Start typing..." autofocus />
  </div>
  <script src="/js/nav.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/typing.js"></script>
</body>
</html>
