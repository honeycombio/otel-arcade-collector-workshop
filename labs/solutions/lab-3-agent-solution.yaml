# OTel Arcade — Lab 3 solution (agent config).
#
# The agent no longer exports directly to Honeycomb. Instead it forwards
# all telemetry to the gateway, which handles final export and fan-out.
#
# All Lab 2 transforms are retained — the agent normalizes telemetry
# before forwarding so the gateway receives already-clean data.
#
# Prerequisites:
#   - Gateway must be deployed first (⚙ Deploy & Configure → Gateway tab → Deploy Gateway)
#   - Apply this config via the Agent tab

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    send_batch_size: 512
    timeout: 5s
  filter/drop_probes:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, "^(GET|POST) /(health|ready)$")'
  transform/normalize:
    trace_statements:
      - context: span
        statements:
          - replace_pattern(span.name, "^(SELECT|INSERT|UPDATE|DELETE|CREATE).*", "db.query")
          - set(span.attributes["player.id"], "***") where span.attributes["player.id"] != nil
          - truncate_all(span.attributes, 128)
      - context: resource
        statements:
          - delete_key(resource.attributes, "app.name")

exporters:
  debug:
    verbosity: basic
  # Forwards all telemetry to the gateway on the shared Docker network.
  otlp_grpc/gateway:
    endpoint: otel-collector-gateway:4317
    tls:
      insecure: true
  # Still needed for the Split (Before→After) view in the Visualizer.
  otlp_http/visualizer-raw:
    endpoint: http://visualizer:4318
    encoding: json
    headers:
      x-raw-channel: "true"
      x-collector-source: agent
    tls:
      insecure: true

service:
  telemetry:
    resource:
      attributes:
        - name: service.name
          value: otel-collector-agent
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    # Captures spans BEFORE transforms — powers the Split (Before→After) view.
    traces/raw:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp_http/visualizer-raw]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop_probes, batch, transform/normalize]
      exporters: [debug, otlp_grpc/gateway]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_grpc/gateway]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_grpc/gateway]
