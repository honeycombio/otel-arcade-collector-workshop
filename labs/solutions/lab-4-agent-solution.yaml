# OTel Arcade — Lab 4 solution (agent config).
#
# Lab 3 self-telemetry config with gateway architecture applied:
#   - Agent forwards all telemetry to otel-collector-gateway:4317 (no direct Honeycomb export)
#   - Self-telemetry from Lab 3 (service.name, metrics push, logs push) is retained
#
# Prerequisites: deploy the gateway first (⚙ Deploy & Configure → Gateway tab → Deploy Gateway)
#
# To apply: paste into the Agent tab editor and click Apply & Restart,
# or: cp labs/solutions/lab-4-agent-solution.yaml collector-agent-config.yaml

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    send_batch_size: 512
    timeout: 5s
  filter/drop_probes:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, "^(GET|POST) /(health|ready)$")'
  transform/normalize:
    trace_statements:
      - context: span
        statements:
          - replace_pattern(span.name, "^(SELECT|INSERT|UPDATE|DELETE|CREATE).*", "db.query")
          - set(span.attributes["player.id"], "***") where span.attributes["player.id"] != nil
          - truncate_all(span.attributes, 128)
      - context: resource
        statements:
          - delete_key(resource.attributes, "app.name")

exporters:
  debug:
    verbosity: basic
  otlp_grpc/gateway:
    endpoint: otel-collector-gateway:4317
    tls:
      insecure: true
  otlp_http/visualizer-raw:
    endpoint: http://visualizer:4318
    encoding: json
    headers:
      x-raw-channel: "true"
      x-collector-source: agent
    tls:
      insecure: true

service:
  telemetry:
    resource:
      attributes:
        - name: service.name
          value: otel-collector-agent
    logs:
      level: info
      processors:
        - batch:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: https://api.honeycomb.io/v1/logs
                headers:
                  - name: x-honeycomb-team
                    value: ${env:HONEYCOMB_API_KEY}
                  - name: x-honeycomb-dataset
                    value: otel-collector
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: https://api.honeycomb.io/v1/metrics
                headers:
                  - name: x-honeycomb-team
                    value: ${env:HONEYCOMB_API_KEY}
                  - name: x-honeycomb-dataset
                    value: otel-collector
  pipelines:
    traces/raw:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp_http/visualizer-raw]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop_probes, batch, transform/normalize]
      exporters: [debug, otlp_grpc/gateway]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_grpc/gateway]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_grpc/gateway]
