# OTel Arcade — Lab 1 solution.
#
# A complete working pipeline: receives OTLP from the arcade services,
# exports to Honeycomb and the Pipeline Visualizer.
#
# Apply this config, play a game, and spans should appear in the
# Visualizer feed within seconds.

# ── Receivers ────────────────────────────────────────────────────────
# The arcade services emit OTLP over gRPC (4317) and HTTP (4318).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# ── Processors ───────────────────────────────────────────────────────
# memory_limiter: hard cap on RAM — prevents OOM crashes under load.
# batch: buffers spans/metrics/logs and sends them together (better throughput).
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    send_batch_size: 512
    timeout: 5s

# ── Exporters ────────────────────────────────────────────────────────
# otlp_grpc/backend  → Honeycomb (credentials from the .env file at the repo root).
# otlp_http/visualizer → local Pipeline Visualizer (live feed and topology).
# debug               → Collector stdout.
exporters:
  debug:
    verbosity: basic
  otlp_grpc/backend:
    endpoint: ${env:OTEL_EXPORTER_ENDPOINT}
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
  otlp_http/visualizer:
    endpoint: http://visualizer:4318
    encoding: json
    headers:
      x-collector-source: agent
    tls:
      insecure: true

# ── Service ──────────────────────────────────────────────────────────
service:
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_grpc/backend, otlp_http/visualizer]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_grpc/backend, otlp_http/visualizer]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_grpc/backend, otlp_http/visualizer]
