# OTel Arcade — Collector Self-Telemetry solution (agent config).
#
# The OTTL-cleanup config with all three self-telemetry exercises applied:
#   Tag the Collector: service.name resource attribute added
#   Push Collector metrics: pushed to Honeycomb (periodic reader)
#   Push Collector logs: pushed to Honeycomb
#
# The agent still exports directly to Honeycomb — the gateway is introduced in the next lab.
#
# To apply: paste into the Agent tab editor and click Apply & Restart,
# or: cp labs/solutions/workshop-2-self-telemetry-agent-solution.yaml collector-agent-config.yaml

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  filter/drop_probes:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, "^(GET|POST) /(health|ready)$")'
  transform/normalize:
    trace_statements:
      - context: span
        statements:
          - replace_pattern(span.name, "^(SELECT|INSERT|UPDATE|DELETE|CREATE).*", "db.query")
          - set(span.attributes["player.id"], "***") where span.attributes["player.id"] != nil
          - truncate_all(span.attributes, 128)
      - context: resource
        statements:
          - delete_key(resource.attributes, "app.name")

exporters:
  debug:
    verbosity: basic
  otlp_grpc/backend:
    endpoint: ${env:OTEL_EXPORTER_ENDPOINT}
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
    sending_queue:
      enabled: true
      sizer: items
      batch:
        flush_timeout: 5s
        min_size: 512
  otlp_http/visualizer:
    endpoint: http://visualizer:4318
    encoding: json
    headers:
      x-collector-source: agent
    tls:
      insecure: true
  # Still needed for the Split (Before→After) view in the Visualizer.
  otlp_http/visualizer-raw:
    endpoint: http://visualizer:4318
    encoding: json
    headers:
      x-raw-channel: "true"
      x-collector-source: agent
    tls:
      insecure: true

service:
  telemetry:
    resource:
      attributes:
        - name: service.name
          value: otel-collector-agent
    logs:
      level: info
      processors:
        - batch:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: https://api.honeycomb.io/v1/logs
                headers:
                  - name: x-honeycomb-team
                    value: ${env:HONEYCOMB_API_KEY}
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: https://api.honeycomb.io/v1/metrics
                headers:
                  - name: x-honeycomb-team
                    value: ${env:HONEYCOMB_API_KEY}
  pipelines:
    # Captures spans BEFORE transforms — powers the Split (Before→After) view.
    traces/raw:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp_http/visualizer-raw]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop_probes, transform/normalize]
      exporters: [debug, otlp_grpc/backend, otlp_http/visualizer]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [debug, otlp_grpc/backend, otlp_http/visualizer]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [debug, otlp_grpc/backend, otlp_http/visualizer]
