# OTel Arcade — Lab 2: OTTL transforms.
#
# Fix the five deliberate telemetry problems using the transform and filter
# processors. Uncomment each statement one at a time and apply — the
# Visualizer's smells counter drops to 0 when all five are working.
#
# The traces/raw pipeline powers the Split view (Before→After) in the
# Visualizer feed so you can see exactly what each fix changes.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    send_batch_size: 512
    timeout: 5s

  # ── OTTL transform processor ──────────────────────────────────────
  transform/normalize:
    trace_statements:
      - context: span
        statements:
          # Fix 1 — normalize raw SQL span names to a stable, low-cardinality value
          # - replace_pattern(name, "^(SELECT|INSERT|UPDATE|DELETE|CREATE).*", "db.query")

          # Fix 2 — redact player.id PII
          # - set(attributes["player.id"], "***") where attributes["player.id"] != nil

          # Fix 4 — truncate long attribute values (e.g. full browser user-agent strings)
          # - truncate_all(attributes, 128)

      - context: resource
        statements:
          # Fix 5 — remove the redundant app.name resource attribute
          # - delete_key(attributes, "app.name")

  # Fix 3 — drop /health and /ready probe spans entirely (filter, not transform)
  # Uncomment below, then add filter/drop_probes before batch in the traces pipeline.
  # filter/drop_probes:
  #   error_mode: ignore
  #   traces:
  #     span:
  #       - 'IsMatch(name, "^(GET|POST) /(health|ready)$")'

exporters:
  debug:
    verbosity: basic
  otlp/backend:
    endpoint: ${env:OTEL_EXPORTER_ENDPOINT}
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
  otlphttp/visualizer:
    endpoint: http://visualizer:4318
    encoding: json
    headers:
      x-collector-source: agent
    tls:
      insecure: true
  # Sends pre-transform spans to the Visualizer's Split (Before→After) view.
  otlphttp/visualizer-raw:
    endpoint: http://visualizer:4318
    encoding: json
    headers:
      x-raw-channel: "true"
      x-collector-source: agent
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    # Captures spans BEFORE any transforms — powers the Split (Before→After) view.
    traces/raw:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlphttp/visualizer-raw]
    traces:
      receivers: [otlp]
      # Once you have statements to apply, add transform/normalize to this list.
      # For Fix 3, also add filter/drop_probes before batch.
      processors: [memory_limiter, batch]
      exporters: [debug, otlp/backend, otlphttp/visualizer]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp/backend, otlphttp/visualizer]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp/backend, otlphttp/visualizer]
